name: Terraform Pipeline

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to run'
        required: true
        default: 'plan'
        type: choice
        options:
          - init
          - plan
          - apply
          - destroy

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      TF_DIR: terraform

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2

    - name: Terraform Init
      if: ${{ github.event.inputs.action == 'init' }}
      run: terraform -chdir=${{ env.TF_DIR }} init

    - name: Terraform Plan
      if: ${{ github.event.inputs.action == 'plan' }}
      run: terraform -chdir=${{ env.TF_DIR }} plan

    - name: Terraform Apply
      if: ${{ github.event.inputs.action == 'apply' }}
      run: terraform -chdir=${{ env.TF_DIR }} apply -auto-approve

    - name: Terraform Destroy
      if: ${{ github.event.inputs.action == 'destroy' }}
      run: terraform -chdir=${{ env.TF_DIR }} destroy -auto-approve